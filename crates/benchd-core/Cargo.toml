[package]
name = "benchd-core"
description = "Pure domain logic for benchd: tags, benches, matching, limits, leases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
strsim = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true, optional = true }
serde_json = { workspace = true }

[dependencies.tokio]
workspace = true
optional = true

[features]
# The USB/IP protocol needs async I/O; the rest of core is pure and stays so.
usbip = ["dep:tokio", "dep:tracing", "tokio/fs", "tokio/net", "tokio/io-util", "tokio/time"]

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
