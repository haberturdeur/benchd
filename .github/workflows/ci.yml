name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: rust:1.88
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt --all --check
          - name: Clippy
            command: cargo clippy --all-targets --all-features -- -D warnings
          - name: Tests
            command: cargo test --all-features
          - name: Daemon integration tests
            command: cargo test -p benchd --test daemons -- --ignored --test-threads=1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Run check
        run: ${{ matrix.command }}
