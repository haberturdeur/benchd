# A benchd SSH tunnel: one per coordinator this machine talks to.
#
# Installed as /etc/benchd/tunnels/<name>.conf and read by
# benchd-tunnel@<name>.service. Name it after the coordinator, so the `lab=`
# in a client's `--coordinator lab=127.0.0.1:4711` and the unit
# benchd-tunnel@lab are visibly the same link.
#
# A coordinator on this machine needs no entry here. It is already on loopback
# and a tunnel to localhost buys nothing (D21).

# Where to dial. The account on the far side needs no shell; see below.
BENCHD_TUNNEL_TARGET=benchd@lab.example

# The local end of the forward -- and therefore the address to hand benchd on
# this machine, in /etc/systemd/system/benchd-*.d/10-coordinator.conf.
#
# Keep this on loopback. Binding anything else republishes the lab to the
# network with no authentication in front of it, which is the exact condition
# the tunnel exists to remove. Note that loopback still means every local user
# on this machine can reach the lab through the forward: the trust boundary is
# "who can log in here", and on a shared machine that is a real statement.
BENCHD_TUNNEL_LISTEN=127.0.0.1:4711

# What to forward to, resolved on the coordinator machine rather than this one.
# The coordinator binds loopback there, so this is its own view of itself.
BENCHD_TUNNEL_REMOTE=127.0.0.1:4711

BENCHD_TUNNEL_KEY=/etc/benchd/tunnels/lab.key
BENCHD_TUNNEL_KNOWN_HOSTS=/etc/benchd/tunnels/lab.known_hosts

# ---------------------------------------------------------------------------
# The other half, on the coordinator machine.
#
# Generate a key per bench machine rather than sharing one, so a
# decommissioned bench is one line to revoke:
#
#   ssh-keygen -t ed25519 -N '' -f /etc/benchd/tunnels/lab.key
#
# Then, in that account's authorized_keys. `restrict` disables everything;
# `port-forwarding` re-enables only what is needed; `permitopen` bounds the
# forward to the coordinator's own port, so a stolen key opens nothing else on
# that machine; and the forced command means that if a session channel is ever
# requested -- `ssh -N` never asks for one -- it cannot become a shell:
#
#   restrict,port-forwarding,permitopen="127.0.0.1:4711",command="/bin/false" ssh-ed25519 AAAA... benchd-tunnel-bench01
#
# Finally, seed the coordinator's host key here, or StrictHostKeyChecking=yes
# will refuse to connect:
#
#   ssh-keyscan lab.example > /etc/benchd/tunnels/lab.known_hosts
#
# ssh-keyscan asks the network what the network's key is, which proves nothing
# on its own. Compare it against the coordinator's real fingerprint, read on
# the coordinator itself:
#
#   ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
