[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
benchd-core = { path = "crates/benchd-core" }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
strsim = "0.11"

[profile.release]
lto = "thin"
